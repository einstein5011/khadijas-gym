<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Khadijas Gym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Khadijas Gym</title>
<style>
  :root{
    --bg1:#fff0f6; --bg2:#ffe0ee;
    --pink:#ff6fb5; --pink-d:#e8579d; --pink-l:#ffb3d1;
    --mag:#c94f86; --ink:#5a2a44; --muted:#a06c86;
    --card:#ffffff; --card-soft:#fff5fa;
    --gold:#ffd166; --green:#38c793;
    --shadow:0 10px 30px rgba(233,87,157,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"Helvetica Neue","Segoe UI",Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;
    padding:0 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .bgHearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bgHearts span{position:absolute;bottom:-40px;animation:floatUp linear infinite;}
  @keyframes floatUp{to{transform:translateY(-110vh) rotate(360deg);opacity:0;}}

  header{position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 20px) 20px 12px;text-align:center;}
  .title{font-size:30px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--pink),var(--pink-d));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:inline-flex;align-items:center;gap:10px;}
  .title svg{width:24px;height:24px;flex:none;}
  .sub{color:var(--muted);font-size:13px;margin-top:3px;letter-spacing:.3px;}

  .tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;
    padding:12px 14px;backdrop-filter:blur(10px);
    background:linear-gradient(180deg,rgba(255,240,246,.9),rgba(255,240,246,.55));}
  .tab{flex:1;border:none;cursor:pointer;border-radius:18px;padding:11px 6px;
    font-family:inherit;font-size:16px;font-weight:800;color:var(--mag);
    background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px rgba(255,143,190,.5);
    transition:transform .18s, box-shadow .2s, background .2s;}
  .tab .day{display:block;font-size:10px;font-weight:700;letter-spacing:1px;opacity:.8;margin-bottom:1px;}
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-d));
    box-shadow:var(--shadow);transform:translateY(-2px) scale(1.03);}
  .tab .mini{display:block;font-size:10px;font-weight:600;opacity:.9;margin-top:3px;}

  .progWrap{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
    margin:6px 18px 4px;padding:12px 16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);}
  .ring{width:66px;height:66px;flex:none;}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round;}
  .ring .bg{stroke:#ffe0ee;}
  .ring .fg{stroke:url(#grad);transition:stroke-dashoffset .6s cubic-bezier(.4,1.4,.4,1);
    transform:rotate(-90deg);transform-origin:50% 50%;}
  .ring text{font-size:19px;font-weight:800;fill:var(--pink-d);}
  .progTxt b{font-size:15px;}
  .progTxt small{color:var(--muted);display:block;font-size:12px;margin-top:2px;}
  .resetDay{margin-left:auto;border:none;background:var(--card-soft);color:var(--muted);
    font-family:inherit;font-size:12px;font-weight:700;border-radius:14px;padding:8px 12px;cursor:pointer;}

  main{position:relative;z-index:2;padding:6px 14px 90px;}
  .group{margin-top:16px;}
  .groupHead{display:flex;align-items:center;gap:8px;margin:4px 6px 8px;}
  .groupHead .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 4px rgba(255,111,181,.2);}
  .groupHead h2{font-size:18px;margin:0;font-weight:800;color:var(--mag);}
  .groupHead .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);
    padding:4px 10px;border-radius:12px;box-shadow:0 2px 8px rgba(233,87,157,.1);}

  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
  .cardHead{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;}
  .thumb{width:64px;height:56px;flex:none;border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#fff0f6,#ffe0ee);display:flex;align-items:center;justify-content:center;}
  .thumb svg{width:100%;height:100%;}
  .cardHead .info{flex:1;min-width:0;}
  .cardHead .nm{font-weight:800;font-size:15px;line-height:1.3;}
  .cardHead .mg{font-size:11px;color:var(--muted);margin-top:2px;}
  .chev{flex:none;color:var(--pink);transition:transform .3s;display:flex;}
  .card.open .chev{transform:rotate(180deg);}
  .check{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--pink-l);
    display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:all .2s;}
  .check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:all .2s;}
  .check svg path{stroke:#fff;}
  .check.done{background:linear-gradient(135deg,var(--green),#2fae7f);border-color:#2fae7f;transform:scale(1.05);}
  .check.done svg{opacity:1;transform:scale(1);}

  .detail{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  .card.open .detail{max-height:820px;}
  .detailIn{padding:0 14px 16px;}
  .hero{border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#fff0f6,#ffdcec);
    display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:12px;}
  .hero svg{width:100%;max-width:280px;height:180px;}

  /* exercise motion: every .mv group tweens between its start pose (--r0/--tx0/--ty0)
     and end pose (--r1/--tx1/--ty1). Only the big hero picture animates. */
  .mv{transform-box:view-box;}
  .card.open .live .mv{animation:mv 2.1s ease-in-out infinite alternate;}
  @keyframes mv{
    from{transform:translate(var(--tx0,0px),var(--ty0,0px)) rotate(var(--r0,0deg));}
    to{transform:translate(var(--tx1,0px),var(--ty1,0px)) rotate(var(--r1,0deg));}
  }
  @media (prefers-reduced-motion:reduce){.card.open .live .mv{animation:none;}}

  .stats{display:flex;gap:10px;margin-bottom:12px;}
  .stat{flex:1;background:var(--card-soft);border-radius:16px;padding:12px;text-align:center;
    box-shadow:inset 0 0 0 1.5px rgba(255,143,190,.35);}
  .stat .v{font-size:22px;font-weight:800;color:var(--pink-d);}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .tip{font-size:13px;color:var(--mag);background:#fff5fa;border-radius:14px;padding:10px 12px;line-height:1.5;
    box-shadow:inset 0 0 0 1.5px rgba(255,143,190,.25);}
  .setRow{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .setRow .lbl{font-size:13px;font-weight:700;color:var(--muted);}
  .setDot{width:38px;height:38px;border-radius:12px;border:2px solid var(--pink-l);background:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pink);cursor:pointer;
    transition:all .18s;font-size:14px;}
  .setDot.on{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;border-color:var(--pink-d);
    transform:translateY(-2px);box-shadow:0 6px 12px rgba(233,87,157,.3);}
  .restBtn{margin-left:auto;border:none;font-family:inherit;font-weight:800;font-size:13px;
    color:var(--pink-d);background:#ffe0ee;border-radius:14px;padding:9px 14px;cursor:pointer;
    display:flex;align-items:center;gap:6px;}
  .restBtn svg{width:15px;height:15px;}
  .watchBtn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;
    text-decoration:none;font-family:inherit;font-weight:800;font-size:14.5px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--pink-d));border-radius:16px;padding:13px;
    box-shadow:0 6px 14px rgba(233,87,157,.3);}
  .watchBtn:active{transform:scale(.98);}
  .watchBtn svg{width:22px;height:22px;flex:none;}
  .walkBtn{flex:1;border:none;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
    color:var(--pink-d);background:#ffe0ee;border-radius:16px;padding:13px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:inset 0 0 0 1.5px rgba(255,143,190,.5);}
  .walkBtn:active{transform:scale(.98);}
  .walkBtn svg{width:17px;height:17px;flex:none;}

  .timer{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(90,42,68,.35);backdrop-filter:blur(6px);}
  .timer.show{display:flex;animation:fade .2s;}
  @keyframes fade{from{opacity:0}}
  .timerBox{background:#fff;border-radius:28px;padding:26px;width:min(320px,86vw);text-align:center;box-shadow:var(--shadow);}
  .timerBox h3{margin:0 0 6px;color:var(--mag);}
  .bigTime{font-size:58px;font-weight:800;color:var(--pink-d);margin:8px 0;font-variant-numeric:tabular-nums;}
  .tRing{width:150px;height:150px;margin:0 auto;}
  .tRing circle{fill:none;stroke-width:12;stroke-linecap:round;}
  .tRing .bg{stroke:#ffe0ee;}
  .tRing .fg{stroke:url(#grad2);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear;}
  .tBtns{display:flex;gap:8px;margin-top:16px;}
  .tBtns button{flex:1;border:none;font-family:inherit;font-weight:800;font-size:15px;border-radius:16px;padding:13px;cursor:pointer;}
  .tAdd{background:#ffe0ee;color:var(--pink-d);}
  .tClose{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;}
  .timePresets{display:flex;gap:6px;justify-content:center;margin-top:12px;}
  .timePresets button{border:none;background:#fff5fa;color:var(--muted);font-family:inherit;font-weight:700;
    border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,143,190,.35);}

  .celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;}
  .conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:drop linear forwards;}
  @keyframes drop{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);
    background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;font-weight:800;padding:14px 22px;
    border-radius:20px;box-shadow:var(--shadow);z-index:70;opacity:0;transition:all .35s;pointer-events:none;font-size:15px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .installTip{margin:10px 18px 0;background:var(--card);border-radius:18px;padding:12px 14px;
    font-size:12.5px;color:var(--muted);line-height:1.6;box-shadow:var(--shadow);display:none;position:relative;z-index:2;}
  .installTip b{color:var(--mag);}
  .installTip.show{display:block;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 20px;position:relative;z-index:2;}
</style>
</head>
<body>
<div class="bgHearts" id="bgHearts"></div>

<svg width="0" height="0"><defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff8fbe"/><stop offset="1" stop-color="#e8579d"/></linearGradient>
  <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff8fbe"/><stop offset="1" stop-color="#e8579d"/></linearGradient>
</defs></svg>

<header>
  <div class="title">
    <svg viewBox="0 0 32 29"><path d="M16 29S2 20 2 10a7 7 0 0 1 14-3 7 7 0 0 1 14 3c0 10-14 19-14 19z" fill="#ff8fbe"/></svg>
    Khadijas Gym
    <svg viewBox="0 0 32 29"><path d="M16 29S2 20 2 10a7 7 0 0 1 14-3 7 7 0 0 1 14 3c0 10-14 19-14 19z" fill="#ff8fbe"/></svg>
  </div>
  <div class="sub">3-Day Split · Push · Pull · Legs<br>+ 20-minute walk every day</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="progWrap">
  <svg class="ring" viewBox="0 0 66 66">
    <circle class="bg" cx="33" cy="33" r="27"/>
    <circle class="fg" id="ringFg" cx="33" cy="33" r="27"/>
    <text id="ringTxt" x="33" y="40" text-anchor="middle">0%</text>
  </svg>
  <div class="progTxt">
    <b id="progLabel">Let's begin</b>
    <small id="progCount">0 of 9 exercises</small>
  </div>
  <button class="resetDay" id="resetDay">Reset day</button>
</div>

<div class="installTip" id="installTip">
  <b>To install on iPhone:</b> open this page in <b>Safari</b>, tap the Share button,
  then <b>Add to Home Screen</b>.
</div>

<main id="app"></main>

<footer>Made with love for Khadija</footer>

<div class="timer" id="timer">
  <div class="timerBox">
    <h3 id="timerTitle">Rest Timer</h3>
    <svg class="tRing" viewBox="0 0 150 150">
      <circle class="bg" cx="75" cy="75" r="63"/>
      <circle class="fg" id="tRingFg" cx="75" cy="75" r="63"/>
    </svg>
    <div class="bigTime" id="bigTime">01:00</div>
    <div class="timePresets" id="timePresets">
      <button data-sec="30">30s</button>
      <button data-sec="60">1 min</button>
      <button data-sec="90">1.5 min</button>
    </div>
    <div class="tBtns">
      <button class="tAdd" id="tAdd">+15s</button>
      <button class="tClose" id="tClose">Done</button>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- data ---------- */
const DAYS = [
  { id:"push", name:"Push", mini:"Chest · Shoulders · Triceps",
    groups:[
      { name:"Chest", ex:[
        {id:"chestpress", nm:"Chest Press Machine", tip:"Press the handles forward slowly and under control, then return gently."},
        {id:"inclinepress", nm:"Incline Chest Press Machine", tip:"Targets the upper chest. Keep your back supported throughout."},
        {id:"pecdeck", nm:"Pec Deck (Chest Fly)", tip:"Bring the handles together in front of you and squeeze the chest."},
      ]},
      { name:"Shoulders", ex:[
        {id:"shoulderpress", nm:"Shoulder Press Machine", tip:"Press upward without fully locking the elbows."},
        {id:"lateralraise", nm:"Lateral Raise Machine", tip:"Raise your arms out to the sides up to shoulder height."},
        {id:"reardelt", nm:"Rear Delt Fly Machine", tip:"Open your arms backward to work the rear shoulders."},
      ]},
      { name:"Triceps", ex:[
        {id:"pushdown", nm:"Cable Pushdown", tip:"Keep your elbows pinned at your sides and push the bar down."},
        {id:"overhead", nm:"Overhead Cable Extension", tip:"Extend your arms fully overhead."},
        {id:"dip", nm:"Triceps Dip Machine", tip:"Lower slowly, then push yourself back up."},
      ]},
      { name:"Cardio", ex:[
        {id:"walk_push", nm:"20-Minute Walk", art:"walk", cardio:true, mins:20, yt:"20 minute walking workout",
         tip:"Finish with a steady 20-minute walk — treadmill or outdoors. Keep an easy pace where you can still talk."},
      ]},
    ]},
  { id:"pull", name:"Pull", mini:"Back · Biceps · Forearms",
    groups:[
      { name:"Back", ex:[
        {id:"latpulldown", nm:"Lat Pulldown", tip:"Pull the bar to your upper chest and squeeze your shoulder blades."},
        {id:"cablerow", nm:"Seated Cable Row", tip:"Pull the handle toward your stomach, keeping your back straight."},
        {id:"chestrow", nm:"Chest-Supported Row Machine", tip:"Rest your chest on the pad and row the handles backward."},
      ]},
      { name:"Biceps", ex:[
        {id:"preacher", nm:"Preacher Curl Machine", tip:"Fix your arms on the pad and curl slowly."},
        {id:"bicepscurl", nm:"Biceps Curl Machine", tip:"Curl your arms up and squeeze the muscle."},
        {id:"cablecurl", nm:"Cable Curl", tip:"Keep your elbows steady while you curl."},
      ]},
      { name:"Forearms", ex:[
        {id:"wristcurl", nm:"Cable Wrist Curl", tip:"Move only your wrists up and down."},
        {id:"revwrist", nm:"Cable Reverse Wrist Curl", tip:"Palms down, lift the wrist upward."},
        {id:"gripmachine", nm:"Wrist Curl Machine (or Grip Machine)", tip:"Grip and squeeze slowly and under control."},
      ]},
      { name:"Cardio", ex:[
        {id:"walk_pull", nm:"20-Minute Walk", art:"walk", cardio:true, mins:20, yt:"20 minute walking workout",
         tip:"Finish with a steady 20-minute walk — treadmill or outdoors. Keep an easy pace where you can still talk."},
      ]},
    ]},
  { id:"legs", name:"Legs", mini:"Thighs · Calves · Abs",
    groups:[
      { name:"Thighs", ex:[
        {id:"legpress", nm:"Leg Press", tip:"Press the platform without fully locking your knees."},
        {id:"legext", nm:"Leg Extension", tip:"Extend your legs fully and squeeze the front thigh."},
        {id:"legcurl", nm:"Seated Leg Curl", tip:"Curl your legs backward slowly and under control."},
      ]},
      { name:"Calves", ex:[
        {id:"standcalf", nm:"Standing Calf Raise", tip:"Raise your heels as high as you can, then lower slowly."},
        {id:"seatcalf", nm:"Seated Calf Raise", tip:"Targets the lower calf muscle."},
        {id:"presscalf", nm:"Leg Press Calf Raise", tip:"Push with the balls of your feet on the platform."},
      ]},
      { name:"Abs", ex:[
        {id:"abcrunch", nm:"Ab Crunch Machine", tip:"Fold your torso forward and squeeze your abs."},
        {id:"cablecrunch", nm:"Cable Crunch", tip:"Pull the rope and crunch your torso down."},
        {id:"captain", nm:"Captain's Chair (Leg Raise)", tip:"Raise your knees toward your chest slowly."},
      ]},
      { name:"Cardio", ex:[
        {id:"walk_legs", nm:"20-Minute Walk", art:"walk", cardio:true, mins:20, yt:"20 minute walking workout",
         tip:"Finish with a steady 20-minute walk — treadmill or outdoors. Keep an easy pace where you can still talk."},
      ]},
    ]},
];
const REPS = "10-12", SETS = 3;

/* ---------- animated illustrations (custom-drawn; the hero picture moves through the exercise) ----------
   Every "mv" group tweens between a start pose (--r0/--tx0/--ty0) and the drawn end pose.
   Figures are side-view jointed stick figures; machines show seat, pads, levers, cables & weight stacks. */
const C={fr:"#f2a2c8",pad:"#ff8fbe",acc:"#e8579d",cab:"#c9629b",body:"#a83d72",deep:"#8f2f5e",floor:"#ffd9e8"};
const W={torso:13,thigh:11,shin:9,ua:8,fa:7};
const L=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const R_=(x,y,w,h,c,rx=4)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${c}"/>`;
const Cc=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const G=(ox,oy,vars,inner)=>`<g class="mv" style="transform-origin:${ox}px ${oy}px;${vars}">${inner}</g>`;
const head=(x,y)=>Cc(x,y,8.5,C.body);
const frame=inner=>`<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="147" rx="88" ry="7" fill="${C.floor}" opacity=".8"/>${inner}</svg>`;

/* weight stack with rising top plates */
const stack=x=>`<rect x="${x-3}" y="96" width="32" height="48" rx="4" fill="none" stroke="${C.fr}" stroke-width="2.5"/>`
 +[122,129,136].map(y=>R_(x,y,26,5.5,C.fr,2)).join("")
 +G(0,0,"--ty1:-12px",R_(x,108,26,5.5,C.acc,2)+R_(x,115,26,5.5,C.acc,2)+L(x+13,108,x+13,88,C.cab,2));

/* jointed pressing arm: shoulder + elbow unfold from tucked to extended (drawn = extended) */
function pressArm(sx,sy,l,base,r,h){
  const ex=sx-l, hx=sx-2*l;
  const handle = h==="bar" ? R_(hx-3,sy-17,6,34,C.acc,3) : Cc(hx,sy,4.5,C.deep);
  const fore = G(ex,sy,`--r0:${r}deg`, L(ex,sy,hx,sy,C.body,W.fa)+handle);
  const whole = G(sx,sy,`--r0:${-r}deg`, L(sx,sy,ex,sy,C.body,W.ua)+fore);
  return base? `<g transform="rotate(${base} ${sx} ${sy})">${whole}</g>` : whole;
}
/* jointed rowing arm: drawn extended forward, pulls back to the waist */
function rowArm(sx,sy,l){
  const ex=sx-l,hx=sx-2*l;
  const fore=G(ex,sy,"--r1:110deg", L(ex,sy,hx,sy,C.body,W.fa)+Cc(hx,sy,4.5,C.deep));
  return G(sx,sy,"--r1:-110deg", L(sx,sy,ex,sy,C.body,W.ua)+fore);
}

const ILLU={
chestpress: frame(
  stack(24)
  +R_(60,42,8,102,C.fr)+L(64,46,106,46,C.fr,6)
  +R_(140,54,10,56,C.pad)+R_(124,108,30,9,C.pad)+L(140,117,140,144,C.fr,5)
  +L(130,102,104,106,C.body,W.thigh)+L(104,106,104,140,C.body,W.shin)+L(104,140,94,140,C.body,5)
  +L(133,100,135,68,C.body,W.torso)+head(134,50)
  +pressArm(132,68,23,0,55,"bar")),

inclinepress: frame(
  R_(46,48,8,96,C.fr)
  +L(150,114,122,68,C.pad,14)+R_(136,112,28,9,C.pad)+L(148,121,148,144,C.fr,5)
  +L(140,106,110,116,C.body,W.thigh)+L(110,116,110,140,C.body,W.shin)

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CLOCK_SVG = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#e8579d" stroke-width="2.2"/><path d="M12 9v4l3 2M9 2h6" stroke="#e8579d" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const CHEV_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const YT_SVG = `<svg viewBox="0 0 24 24" fill="none"><rect x="1.5" y="5" width="21" height="14" rx="4.5" fill="#fff"/><path d="M10 9l5 3-5 3V9z" fill="#e8579d"/></svg>`;
/* Opens a YouTube search pre-filtered to a female demonstration of this exact exercise. */
function ytLink(name){
  const q = name.replace(/\(.*?\)/g,"").trim() + " proper form woman";
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
}

/* ---------- state / storage ---------- */
const KEY="khadijasgym_v1";
let store = JSON.parse(localStorage.getItem(KEY) || "{}");
let current = 0;
let openCards = new Set(); // exercise ids whose detail is expanded (kept across re-renders)
function save(){localStorage.setItem(KEY, JSON.stringify(store));}
function setsOf(id){ if(!store[id]) store[id]=[false,false,false]; return store[id]; }
function exDone(id){ return setsOf(id).every(Boolean); }

/* ---------- tabs ---------- */
const tabsEl = document.getElementById("tabs");
DAYS.forEach((d,i)=>{
  const b=document.createElement("button");
  b.className="tab"+(i===0?" active":"");
  b.innerHTML=`<span class="day">DAY ${i+1}</span>${d.name}<span class="mini">${d.mini}</span>`;
  b.addEventListener("click",()=>switchDay(i));
  tabsEl.appendChild(b);
});

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  const day=DAYS[current];
  let html="";
  day.groups.forEach(g=>{
    html+=`<div class="group"><div class="groupHead"><span class="dot"></span><h2>${g.name}</h2>
      <span class="cnt">${g.ex.length} exercise${g.ex.length>1?"s":""}</span></div>`;
    g.ex.forEach(ex=>{
      const done=exDone(ex.id), s=setsOf(ex.id);
      const stats = ex.cardio
        ? `<div class="stat"><div class="v">${ex.mins}</div><div class="l">Minutes</div></div>
           <div class="stat"><div class="v">Easy</div><div class="l">Pace</div></div>`
        : `<div class="stat"><div class="v">${SETS}</div><div class="l">Sets</div></div>
           <div class="stat"><div class="v">${REPS}</div><div class="l">Reps</div></div>`;
      const controls = ex.cardio
        ? `<div class="setRow">
             <button class="walkBtn" data-walk="${ex.mins}">${CLOCK_SVG} Start ${ex.mins}:00 walk</button>
           </div>`
        : `<div class="setRow" data-sets="${ex.id}">
             <span class="lbl">Sets:</span>
             ${[0,1,2].map(i=>`<div class="setDot ${s[i]?"on":""}" data-set="${i}">${i+1}</div>`).join("")}
             <button class="restBtn" data-rest>${CLOCK_SVG} Rest</button>
           </div>`;
      html+=`<div class="card${openCards.has(ex.id)?" open":""}${ex.cardio?" cardio":""}" data-card="${ex.id}">
        <div class="cardHead" data-toggle>
          <div class="thumb">${illu(ex.art||ex.id)}</div>
          <div class="info"><div class="nm">${ex.nm}</div><div class="mg">${g.name}</div></div>
          <div class="check ${done?"done":""}" data-check="${ex.id}">${CHECK_SVG}</div>
          <div class="chev">${CHEV_SVG}</div>
        </div>
        <div class="detail"><div class="detailIn">
          <div class="hero live">${illu(ex.art||ex.id)}</div>
          <div class="stats">${stats}</div>
          <div class="tip">${ex.tip}</div>
          <a class="watchBtn" href="${ytLink(ex.yt||ex.nm)}" target="_blank" rel="noopener">${YT_SVG} Watch on YouTube</a>
          ${controls}
        </div></div>
      </div>`;
    });
    html+=`</div>`;
  });
  app.innerHTML=html;
  updateProgress();
}

/* single delegated handler — survives re-renders, so every control works */
app.addEventListener("click",(e)=>{
  const check=e.target.closest("[data-check]");
  if(check){ const id=check.dataset.check; const before=dayPct().pct;
    const now=!exDone(id); store[id]=[now,now,now]; save(); render(); maybeCelebrate(before); return; }
  const dot=e.target.closest("[data-set]");
  if(dot){ const id=dot.closest("[data-sets]").dataset.sets; const i=+dot.dataset.set; const before=dayPct().pct;
    const s=setsOf(id); s[i]=!s[i]; save(); render(); maybeCelebrate(before); return; }
  const walk=e.target.closest("[data-walk]");
  if(walk){ openTimer(+walk.dataset.walk*60, "Walking Session", walk.closest("[data-card]").dataset.card); return; }
  if(e.target.closest("[data-rest]")){ openTimer(60); return; }
  const head=e.target.closest("[data-toggle]");
  if(head){ const card=head.closest(".card"); const id=card.dataset.card;
    if(openCards.has(id)) openCards.delete(id); else openCards.add(id);
    card.classList.toggle("open"); return; }
});

function switchDay(i){
  if(i===current) return;
  current=i;
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));
  app.style.opacity=0; app.style.transform="translateY(8px)";
  setTimeout(()=>{ render(); app.style.transition="all .28s"; app.style.opacity=1; app.style.transform="none"; },120);
}

/* ---------- progress ---------- */
const RING_C = 2*Math.PI*27;
document.getElementById("ringFg").style.strokeDasharray=RING_C;
function dayPct(){
  const all=DAYS[current].groups.flatMap(g=>g.ex);
  const done=all.filter(e=>exDone(e.id)).length;
  return {done, total:all.length, pct:Math.round(done/all.length*100)};
}
function updateProgress(){
  const {done,total,pct}=dayPct();
  document.getElementById("ringFg").style.strokeDashoffset = RING_C*(1-pct/100);
  document.getElementById("ringTxt").textContent = pct+"%";
  document.getElementById("progCount").textContent = `${done} of ${total} exercises`;
  document.getElementById("progLabel").textContent = pct===0?"Let's begin" : pct<100?"Keep going!" : "Day complete!";
}
function maybeCelebrate(before){
  if(dayPct().pct===100 && before<100){ celebrate(); toast("Great job, Khadija! Day complete"); }
}
document.getElementById("resetDay").addEventListener("click",()=>{
  DAYS[current].groups.flatMap(g=>g.ex).forEach(e=>store[e.id]=[false,false,false]);
  save(); render();
});

/* ---------- celebration ---------- */
function celebrate(){
  const box=document.getElementById("celebrate");
  const colors=["#ff6fb5","#e8579d","#ffb3d1","#ffd166","#ff8fbe","#ffffff"];
  for(let i=0;i<44;i++){
    const s=document.createElement("div"); s.className="conf";
    s.style.left=Math.random()*100+"vw";
    s.style.background=colors[i%colors.length];
    s.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    s.style.animationDelay=(Math.random()*.4)+"s";
    s.style.transform=`rotate(${Math.random()*360}deg)`;
    box.appendChild(s);
    setTimeout(()=>s.remove(),3600);
  }
}
let toastT;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---------- rest timer ---------- */
const timerEl=document.getElementById("timer");
const bigTime=document.getElementById("bigTime");
const tRingFg=document.getElementById("tRingFg");
const T_C=2*Math.PI*63; tRingFg.style.strokeDasharray=T_C;
let total=60, left=60, tick=null, walkId=null;
function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function drawTimer(){ bigTime.textContent=fmt(left); tRingFg.style.strokeDashoffset=T_C*(1-left/total); }
function openTimer(sec=60, title="Rest Timer", completeId=null){
  total=sec; left=sec; walkId=completeId;
  document.getElementById("timerTitle").textContent=title;
  document.getElementById("timePresets").style.display = completeId ? "none" : "flex";
  document.getElementById("tAdd").textContent = completeId ? "+1 min" : "+15s";
  drawTimer(); timerEl.classList.add("show"); startTick();
}
function startTick(){ clearInterval(tick); tick=setInterval(()=>{ left--; if(left<=0){ left=0; drawTimer(); clearInterval(tick);
   if(navigator.vibrate) navigator.vibrate([200,100,200]);
   if(walkId){ const before=dayPct().pct; store[walkId]=[true,true,true]; save(); render();
     toast("Walk complete — well done!"); maybeCelebrate(before); }
   else toast("Rest over — let's go!");
   setTimeout(closeTimer,700); return;} drawTimer(); },1000); }
function closeTimer(){ clearInterval(tick); walkId=null; timerEl.classList.remove("show"); }
document.getElementById("tClose").addEventListener("click",closeTimer);
document.getElementById("tAdd").addEventListener("click",()=>{ left+=walkId?60:15; total=Math.max(total,left); drawTimer(); });
document.querySelectorAll(".timePresets button").forEach(b=>b.addEventListener("click",()=>openTimer(+b.dataset.sec)));
timerEl.addEventListener("click",(e)=>{ if(e.target===timerEl) closeTimer(); });

/* ---------- install tip (iOS Safari, not standalone) ---------- */
(function(){
  const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
  if(isiOS && !standalone){ document.getElementById("installTip").classList.add("show"); }
})();

/* ---------- floating hearts (SVG, no emoji) ---------- */
(function(){
  const box=document.getElementById("bgHearts");
  const heart=c=>`<svg viewBox="0 0 32 29" width="18" height="16"><path d="M16 29S2 20 2 10a7 7 0 0 1 14-3 7 7 0 0 1 14 3c0 10-14 19-14 19z" fill="${c}"/></svg>`;
  const cols=["rgba(255,143,190,.35)","rgba(255,179,209,.4)","rgba(232,87,157,.25)"];
  for(let i=0;i<10;i++){ const s=document.createElement("span"); s.innerHTML=heart(cols[i%cols.length]);
    s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(9+Math.random()*10)+"s";
    s.style.animationDelay=(Math.random()*10)+"s"; const sc=(.7+Math.random()*1.1); s.style.transform=`scale(${sc})`; box.appendChild(s); }
})();

/* ---------- service worker ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

render();
</script>
